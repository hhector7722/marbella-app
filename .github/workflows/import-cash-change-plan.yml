name: Import cash change plan

on:
  push:
    branches:
      - cash-change-modal-integrated
    paths:
      - .github/workflows/import-cash-change-plan.yml

permissions:
  contents: write

jobs:
  import-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cash-change-modal-integrated
          fetch-depth: 0

      - name: Download plan image
        env:
          PLAN_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3FbPDyMvOG6AJTAylE0jjXz2PrF/0f31ff5d-8b79-42ca-9d63-f61595f2b8a8.png
        run: |
          set -euo pipefail
          mkdir -p public/images
          curl --fail --location "$PLAN_URL" --output public/images/cash-change-plan.png
          test -s public/images/cash-change-plan.png

      - name: Commit plan image
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/cash-change-plan.png
          if git diff --cached --quiet; then
            echo "Plan image already present"
            exit 0
          fi
          git commit -m "Add realistic cash change plan"
          git push origin HEAD:cash-change-modal-integrated

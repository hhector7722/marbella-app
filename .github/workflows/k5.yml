name: K5 Interpretation

on:
  push:
    branches:
      - 'k5-*'
    paths:
      - 'src/lib/albaranes/k5/**'
      - 'src/lib/albaranes/supplier-profiles/**'
      - 'src/app/dashboard/albaranes/interpretation-actions.ts'
      - 'src/app/dashboard/albaranes/receipt-actions.ts'
      - 'src/app/dashboard/albaranes/k5/**'
      - 'src/app/api/internal/albaranes/k5/**'
      - 'src/components/albaranes/InterpretationProposalPanel.tsx'
      - 'src/components/albaranes/K5BatchReceiptReview.tsx'
      - 'src/components/albaranes/K5MappingAssistant.tsx'
      - 'supabase/functions/docling-evidence-worker/**'
      - 'scripts/k5/**'
      - 'supabase/migrations/*k5*'
      - '.github/workflows/k5.yml'
  pull_request:
    paths:
      - 'src/lib/albaranes/k5/**'
      - 'src/lib/albaranes/supplier-profiles/**'
      - 'src/app/dashboard/albaranes/interpretation-actions.ts'
      - 'src/app/dashboard/albaranes/receipt-actions.ts'
      - 'src/app/dashboard/albaranes/k5/**'
      - 'src/app/api/internal/albaranes/k5/**'
      - 'src/components/albaranes/InterpretationProposalPanel.tsx'
      - 'src/components/albaranes/K5BatchReceiptReview.tsx'
      - 'src/components/albaranes/K5MappingAssistant.tsx'
      - 'supabase/functions/docling-evidence-worker/**'
      - 'scripts/k5/**'
      - 'supabase/migrations/*k5*'
      - '.github/workflows/k5.yml'

jobs:
  contracts:
    name: K5 deterministic contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact arithmetic and normalizer
        run: >-
          node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test
          src/lib/albaranes/k5/exact-decimal.test.ts
          src/lib/albaranes/k5/proposal-fingerprint.test.ts
          src/lib/albaranes/k5/trusted-mapping.test.ts
          src/lib/albaranes/k5/normalizer.test.ts
          src/lib/albaranes/k5/normalizer-ametller-decimals.test.ts
          src/lib/albaranes/k5/normalizer-ametller-bag.test.ts
          src/lib/albaranes/k5/case-discount-normalizer.test.ts
          src/lib/albaranes/k5/proposal-lineage.test.ts
          src/lib/albaranes/k5/batch-review.test.ts
          src/lib/albaranes/k5/mapping-assistant.test.ts
      - name: Supplier profiles
        run: >-
          node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test
          src/lib/albaranes/supplier-profiles/supplier-profiles.test.ts
      - name: K5/K4 safety contract
        run: node --test scripts/k5/k5-interpretation-contract.test.cjs

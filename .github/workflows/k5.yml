name: K5 Interpretation

on:
  push:
    branches:
      - 'k5-*'
    paths:
      - 'src/lib/albaranes/k5/**'
      - 'src/lib/albaranes/extractors/**'
      - 'src/lib/albaranes/pipeline/**'
      - 'src/app/api/internal/albaranes/mistral-*/**'
      - 'scripts/albaranes/**'
      - 'src/app/dashboard/albaranes/receipt-actions.ts'
      - 'src/app/dashboard/albaranes/actions.ts'
      - 'src/components/albaranes/LineMappingModal.tsx'
      - 'src/app/ingredients/**'
      - 'src/components/ingredients/**'
      - 'src/app/recipes/**'
      - 'scripts/pricing/**'
      - 'src/app/dashboard/albaranes/k5/**'
      - 'src/app/api/internal/albaranes/k5/**'
      - 'src/components/albaranes/K5BatchReceiptReview.tsx'
      - 'src/components/albaranes/K5MappingAssistant.tsx'
      - 'scripts/k5/**'
      - 'supabase/migrations/*k5*'
      - 'supabase/migrations/*k3*'
      - '.github/workflows/k5.yml'
  pull_request:
    paths:
      - 'src/lib/albaranes/k5/**'
      - 'src/lib/albaranes/extractors/**'
      - 'src/lib/albaranes/pipeline/**'
      - 'src/app/api/internal/albaranes/mistral-*/**'
      - 'scripts/albaranes/**'
      - 'src/app/dashboard/albaranes/receipt-actions.ts'
      - 'src/app/dashboard/albaranes/actions.ts'
      - 'src/components/albaranes/LineMappingModal.tsx'
      - 'src/app/ingredients/**'
      - 'src/components/ingredients/**'
      - 'src/app/recipes/**'
      - 'scripts/pricing/**'
      - 'src/app/dashboard/albaranes/k5/**'
      - 'src/app/api/internal/albaranes/k5/**'
      - 'src/components/albaranes/K5BatchReceiptReview.tsx'
      - 'src/components/albaranes/K5MappingAssistant.tsx'
      - 'scripts/k5/**'
      - 'supabase/migrations/*k5*'
      - 'supabase/migrations/*k3*'
      - '.github/workflows/k5.yml'

jobs:
  contracts:
    name: K5 deterministic contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Exact arithmetic and K5 guards
        run: >-
          node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test
          src/lib/albaranes/k5/exact-decimal.test.ts
          src/lib/albaranes/k5/proposal-fingerprint.test.ts
          src/lib/albaranes/k5/trusted-mapping.test.ts
          src/lib/albaranes/k5/variable-weight.test.ts
          src/lib/albaranes/k5/proposal-lineage.test.ts
          src/lib/albaranes/k5/auto-apply-guard.test.ts
          src/lib/albaranes/k5/batch-review.test.ts
          src/lib/albaranes/k5/mapping-assistant.test.ts
          src/lib/ingredient-pack-pricing.test.ts
      - name: Mistral canonical pipeline
        run: >-
          node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test
          src/lib/albaranes/pipeline/*.test.ts
      - name: K4 receipt contract
        run: npm run test:k4:receipt-contract
      - name: Canonical pricing and single UX contract
        run: npm run test:pricing
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Focused lint
        if: ${{ always() }}
        run: >-
          pnpm exec eslint
          src/lib/albaranes/k5/proposal-fingerprint.ts
          src/lib/albaranes/k5/auto-apply-guard.ts
          src/lib/albaranes/k5/auto-apply-guard.test.ts
          src/lib/albaranes/extractors/*.ts
          src/lib/albaranes/pipeline/*.ts
          src/app/api/internal/albaranes/mistral-process/route.ts
          src/app/api/internal/albaranes/mistral-shadow/route.ts
          src/app/api/internal/albaranes/k5/auto-apply/route.ts
          scripts/albaranes/*.mjs
          src/app/dashboard/albaranes/k5/actions.ts
          src/app/dashboard/albaranes/k5/page.tsx
          src/lib/read-models/labor-cost-day-projector.ts
          src/lib/read-models/labor-cost-month-projector.ts

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Propuestas · Bar La Marbella</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --petroleo: #36606F;
      --petroleo-bg: #4a7584;
      --petroleo-deep: #243f48;
      --petroleo-soft: #4a7a8a;
      --card: #ffffff;
      --ink: #1c2428;
      --muted: #8a969b;
      --white: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background: var(--petroleo-bg);
      line-height: 1.3;
      -webkit-font-smoothing: antialiased;
    }
    .sheet {
      max-width: 420px;
      margin: 0 auto;
      height: 100%;
      height: 100dvh;
      padding: 0.55rem 0.7rem calc(0.55rem + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-height: 0;
    }
    .logo-wrap {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo-wrap img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      display: block;
    }
    .stack {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      gap: 0.85rem;
    }
    .card {
      flex: 0 0 auto;
      background: var(--card);
      border-radius: 1.35rem;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
    }
    .card-head {
      background: var(--petroleo-deep);
      color: var(--white);
      padding: 0.75rem 0.9rem 0.7rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .card-head .price {
      font-size: clamp(1.35rem, 5.2vw, 1.65rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .card-head .price span {
      font-size: 0.72rem;
      font-weight: 500;
      opacity: 0.75;
      letter-spacing: 0;
    }
    .card-head .meta {
      font-size: 0.72rem;
      font-weight: 600;
      opacity: 0.85;
      text-align: right;
      white-space: nowrap;
    }
    .card-body {
      background: var(--card);
      padding: 0.75rem 0.4rem 0.85rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem 0;
    }
    .cell {
      padding: 0.4rem 0.7rem;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.18rem;
    }
    .cell .label {
      display: flex;
      align-items: center;
      gap: 0.28rem;
      font-size: 0.62rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }
    .cell .label .ico {
      font-size: 0.72rem;
      line-height: 1;
    }
    .cell .value {
      font-size: clamp(0.95rem, 3.6vw, 1.1rem);
      font-weight: 700;
      color: var(--petroleo);
      letter-spacing: -0.02em;
      line-height: 1.15;
      padding-left: 1rem;
    }
    .cell .value em {
      font-style: normal;
      font-size: 0.68em;
      font-weight: 600;
      color: var(--petroleo-soft);
      margin-left: 0.15rem;
    }
    @media print {
      html, body { height: auto; overflow: visible; }
      .sheet { height: auto; }
      .card { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="logo-wrap">
      <img src="/icons/logo-white.png" alt="Bar La Marbella" width="595" height="613" />
    </div>

    <div class="stack">
      <article class="card">
        <header class="card-head">
          <div class="price">14 € <span>/ persona</span></div>
          <div class="meta">420 € · 30 pers.</div>
        </header>
        <div class="card-body">
          <div class="grid">
            <div class="cell">
              <div class="label"><span class="ico" aria-hidden="true">🥖</span> Bocadillos</div>
              <div class="value">15</div>
            </div>
            <div class="cell">
              <div class="label"><span class="ico" aria-hidden="true">🥔</span> Braves</div>
              <div class="value">6</div>
            </div>
            <div class="cell">
              <div class="label"><span class="ico" aria-hidden="true">🧀</span> Croquetas</div>
              <div class="value">2<em>/ pers.</em></div>
            </div>
            <div class="cell">
              <div class="label"><span class="ico" aria-hidden="true">🍻</span> Bebidas</div>
              <div class="value">2<em>/ pers.</em></div>
            </div>
          </div>
        </div>
      </article>

      <article class="card">
        <header class="card-head">
          <div class="price">15 € <span>/ persona</span></div>
          <div class="meta">450 € · 30 pers.</div>
        </header>
        <div class="card-body">
          <div class="grid">
            <div class="cell">
              <div class="label"><span class="ico" aria-hidden="true">🥖</span> Bocadillos</div>
              <div class="value">22</div>
            </div>
            <div class="cell">
              <div class="label"><span class="ico" aria-hidden="true">🥔</span> Braves</div>
              <div class="value">7</div>
            </div>
            <div class="cell">
              <div class="label"><span class="ico" aria-hidden="true">🧀</span> Croquetas</div>
              <div class="value">2<em>/ pers.</em></div>
            </div>
            <div class="cell">
              <div class="label"><span class="ico" aria-hidden="true">🍻</span> Bebidas</div>
              <div class="value">2<em>/ pers.</em></div>
            </div>
          </div>
        </div>
      </article>

      <article class="card">
        <header class="card-head">
          <div class="price">16 € <span>/ persona</span></div>
          <div class="meta">480 € · 30 pers.</div>
        </header>
        <div class="card-body">
          <div class="grid">
            <div class="cell">
              <div class="label"><span class="ico" aria-hidden="true">🥖</span> Bocadillos</div>
              <div class="value">28</div>
            </div>
            <div class="cell">
              <div class="label"><span class="ico" aria-hidden="true">🥔</span> Braves</div>
              <div class="value">8</div>
            </div>
            <div class="cell">
              <div class="label"><span class="ico" aria-hidden="true">🧀</span> Croquetas</div>
              <div class="value">2<em>/ pers.</em></div>
            </div>
            <div class="cell">
              <div class="label"><span class="ico" aria-hidden="true">🍻</span> Bebidas</div>
              <div class="value">2<em>/ pers.</em></div>
            </div>
          </div>
        </div>
      </article>
    </div>
  </div>
</body>
</html>
